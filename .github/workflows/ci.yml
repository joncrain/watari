name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: WatariCore (Linux)
    runs-on: ubuntu-latest
    # setup-swift@v2 lags releases; keep in sync with .swift-version
    container:
      image: swift:6.4.0-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: swift test
