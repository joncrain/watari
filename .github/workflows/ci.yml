name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: WatariCore (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Swift version
        id: swift
        run: echo "version=$(tr -d '[:space:]' < .swift-version)" >> "$GITHUB_OUTPUT"
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ steps.swift.outputs.version }}
      - run: swift test
