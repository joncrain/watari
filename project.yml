name: Watari
options:
  bundleIdPrefix: app.watari
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
packages:
  Watari:
    path: .
targets:
  Watari:
    type: application
    platform: macOS
    sources:
      - path: App
    resources:
      - path: Resources/AppIcon.icns
    dependencies:
      - package: Watari
        product: WatariCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.watari.mac
        PRODUCT_NAME: Watari
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Watari.entitlements
        COMBINE_HIDPI_IMAGES: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
    entitlements:
      path: App/Watari.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - "/Desktop/"
          - "/Documents/"
          - "/Downloads/"
          - "/Pictures/"
          - "/Movies/"
          - "/Music/"
          - "/Public/"
          - "/Library/Preferences/com.apple.dock.plist"
        com.apple.security.temporary-exception.shared-preference.read-write:
          - "com.apple.dock"
        com.apple.security.network.client: true
        com.apple.security.network.server: true
